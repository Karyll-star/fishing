<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#d7f0ea"><title>荒岛钓鱼求生</title><link rel="stylesheet" href="style.css"></head><body><main class="phone">
<header class="topbar"><div class="brand"><span class="brand-icon">☼</span><div><b>潮汐手记</b><small>荒岛钓鱼求生</small></div></div><button class="coin" onclick="openShop()">🪙 <span id="coins">0</span> <i>＋</i></button></header>
<section class="island-scene" id="scene"><div class="sun"></div><div class="cloud cloud1">☁</div><div class="cloud cloud2">☁</div><div class="bird">⌁　⌁</div><div class="island-back"></div><div class="palm palm1">🌴</div><div class="hut">🛖</div><div class="island-front"></div><div class="rock">🪨</div><div class="fisher">🧍🏻‍♂️</div><div class="water"><div class="wave wave-a"></div><div class="wave wave-b"></div><div id="bobber" class="bobber">●</div></div><div class="scene-title"><span id="islandName">漂木湾</span><small id="dayLabel">第 1 天 · 晴</small></div><button class="island-switch" onclick="openIslands()">群岛地图　⌄</button><div class="scene-dialog" id="dialog">海风把你带到了这里。先钓几条鱼，去找阿岚换点补给吧。</div></section>
<section class="status-row"><div class="status-pill">⚡ <span id="stamina">8</span>/<span id="staminaMax">8</span></div><div class="status-pill">🎣 <span id="rodName">旧木鱼竿</span></div><div class="status-pill">🧺 背包 <span id="fishCount">0</span></div></section>
<section class="play-area" id="playArea"><div class="section-head"><div><small class="eyebrow">潮汐正在流动</small><h1 id="activityTitle">礁石边垂钓</h1></div><span class="location-tag" id="locationTag">近海</span></div><div class="fishing-card" id="fishingCard"><div class="float-ring"><span id="floatIcon">◉</span><i class="ring r1"></i><i class="ring r2"></i></div><div class="fish-status" id="fishStatus">鱼线已整理好<br><b>抛下鱼钩，等一尾鱼</b></div><div class="tension-wrap hidden" id="tensionWrap"><div class="tension-label"><span>鱼线拉力</span><span><b id="tensionText">30</b>%</span></div><div class="meter"><i id="tensionMeter"></i><em></em></div><div class="progress-label"><span>收线进度</span><span><b id="catchText">0</b>%</span></div><div class="meter catch-meter"><i id="catchMeter"></i></div></div><button class="primary-action" id="fishAction" onclick="fishAction()">抛竿</button><div class="action-hint" id="actionHint">点击开始垂钓</div></div><div class="quick-actions"><button onclick="openTrade()"><span>🧑‍🌾</span><b>找阿岚交易</b><small>鱼获换物资</small></button><button onclick="openInventory()"><span>🎒</span><b>整理背包</b><small>装备与鱼获</small></button><button onclick="openBoss()"><span>🐋</span><b id="bossLabel">挑战 Boss</b><small id="bossHint">修好船后出发</small></button></div></section>
<section class="promo" onclick="claimAd()"><div class="promo-icon">📦</div><div class="promo-copy"><b>海上漂来的补给箱</b><small>看一段短片，领取鱼饵和应急补给</small></div><button class="ad-button">看视频领</button><span class="ad-mark">广告</span></section>
<nav class="bottom-nav"><button class="active" onclick="showHome()"><span>⌂</span>营地</button><button onclick="openTrade()"><span>⇄</span>交易</button><button onclick="openInventory()"><span>▣</span>背包</button><button onclick="openCollection()"><span>◎</span>图鉴</button><button onclick="openShop()"><span>♧</span>商店</button></nav>
<div class="overlay hidden" id="overlay" onclick="overlayClick(event)"><section class="sheet" id="sheet"><div class="sheet-handle"></div><button class="close" onclick="closeSheet()">×</button><div id="sheetContent"></div></section></div><div id="toast" class="toast"></div>
</main><script src="game.js"></script></body></html>
